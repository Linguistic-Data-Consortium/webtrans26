# Async adapter only works within the same process, so for manually triggering cable updates from a console,
# and seeing results in the browser, you must do so from the web console (running inside the dev process),
# not a terminal started via bin/rails console! Add "console" to any action or any ERB template view
# to make the web console appear.
development:
  adapter: async

test:
  adapter: test

# The transcription REPL harness (bin/repl) runs a single process, like
# development. Without an entry here Action Cable falls back to its default
# adapter, redis, which isn't in the bundle — the server still boots, but logs
# "Error loading the 'redis' Action Cable pubsub adapter" on every attempt.
repl:
  adapter: async

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
