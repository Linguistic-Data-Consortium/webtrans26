services:
  web:
    build:
      context: .
      target: dev
    # Published on this machine's loopback only. A bare "3000:3000" listens on
    # every interface, which put a development server (open signup that signs
    # you straight in, full error pages) on whatever network you're on, and on
    # Linux past ufw, since Docker writes its own firewall rules. To reach it
    # from another device for a while, use "0.0.0.0:3000:3000" and change it back.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/rails
      # An anonymous volume, masking the host's node_modules on purpose: the
      # host's may hold binaries built for another platform. The cost is that
      # it PERSISTS across restarts and rebuilds, so after any change to
      # package.json or bun.lock the container keeps installing nothing new and
      # vite reports "Failed to resolve import". Recreate it:
      #     docker compose build && docker compose up -V
      # (-V renews anonymous volumes only; `down -v` would also drop gem_cache
      # and db_data.) Or, to patch a running container: bun install in it.
      - /rails/node_modules
      - gem_cache:/gems
    # Example only: uncomment and point at your own files if you need to pass
    # extra variables in. `.env*` is gitignored, so these paths do not exist in
    # a fresh clone and compose refuses to start when they are enabled —
    # "env file .../.env/development/aws not found".
    #
    # Nothing in the app requires them: it reads what it needs from
    # config/credentials.yml.enc and the variables in docs/CONFIGURATION.md,
    # which can also go under `environment:` below.
    # env_file:
    #   - .env/development/aws
    environment:
      - RAILS_ENV=development
      - VITE_RUBY_HOST=vite
    # command: sleep 300
  vite:
    build:
      context: .
      target: dev
    # entrypoint: ./docker-vite-entrypoint.sh
    # command: bunx --bun vite
    command: bun run dev -- --host --port 3036
    # Loopback only, as for web above, and more so here: the Vite dev server can
    # read the project directory, master key included, and has had file-read
    # bugs. web reaches it as vite:3036 over the compose network, which
    # published ports don't affect.
    ports:
      - "127.0.0.1:3036:3036"
    volumes:
      - .:/rails
      # An anonymous volume, masking the host's node_modules on purpose: the
      # host's may hold binaries built for another platform. The cost is that
      # it PERSISTS across restarts and rebuilds, so after any change to
      # package.json or bun.lock the container keeps installing nothing new and
      # vite reports "Failed to resolve import". Recreate it:
      #     docker compose build && docker compose up -V
      # (-V renews anonymous volumes only; `down -v` would also drop gem_cache
      # and db_data.) Or, to patch a running container: bun install in it.
      - /rails/node_modules
      - gem_cache:/gems
    # Example only: uncomment and point at your own files if you need to pass
    # extra variables in. `.env*` is gitignored, so these paths do not exist in
    # a fresh clone and compose refuses to start when they are enabled —
    # "env file .../.env/development/aws not found".
    #
    # Nothing in the app requires them: it reads what it needs from
    # config/credentials.yml.enc and the variables in docs/CONFIGURATION.md,
    # which can also go under `environment:` below.
    # env_file:
    #   - .env/development/aws
    environment:
      - DEBUG='*vite*'
      - RAILS_ENV=development
      - VITE_RUBY_HOST=0.0.0.0
  # database:
  #   image: postgres
  #   ports:
  #     - 5439:5432
  #   env_file:
  #     - .envv/development/database
  #     - .envv/development/aws
  #   volumes:
  #     - db_data:/var/lib/postgresql/data
volumes:
  db_data:
  gem_cache:
